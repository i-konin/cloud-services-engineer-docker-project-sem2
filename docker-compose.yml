services:
  backend:
    build: ./backend
    container_name: backend_app
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - backend-logs:/app/logs

  frontend:
    build: ./frontend
    container_name: frontend_app
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  backend-logs: