services:
  backend:
    build: ./backend
    container_name: backend_app
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend_app
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge