secrets:
  api_key_secret:
    file: ./api_key.txt
# закомментировал, что бы в случае тестового запуска на ревью 
# сборка не упала из-за того, что файл не найден.
# Пример использования секрета так же закомменчен в блоке backend

services:
  proxy:
    build: ./proxy
    container_name: proxy_app
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build: ./backend
    expose:
      - "8081"
    restart: unless-stopped
    read_only: true 
    tmpfs:
      - /app/logs
      - /tmp
    networks:
      - app-network
    volumes:
      - backend-logs:/app/logs
      - ./backend:/app:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
      resources:
        limits:
          cpus: '${BE_CPU:-0.5}'
          memory: ${BE_MEM:-256M}
    secrets:
      - api_key_secret
    environment:
      - API_KEY_FILE=/run/secrets/api_key_secret
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    expose:
      - "80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - app-network
    volumes:
      - ./frontend:/app:ro
    deploy:
      replicas: ${FRONTEND_REPLICAS:-1}
      resources:
        limits:
          cpus: '${FE_CPU:-0.3}'
          memory: ${FE_MEM:-128M}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  backend-logs: